name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# contents: write is only for the release step below; every other step just
# reads the checkout.
permissions:
  contents: write

# Actions are pinned to commit SHAs rather than tags. A tag is mutable: whoever
# owns the action can move it, and this workflow would then run whatever it was
# moved to, with this workflow's permissions and its token. The trailing comment
# is the version that SHA was, so the pins stay readable and Dependabot can bump
# them.
jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    env:
      # Pinned, and actually used: the download below fetched `latest` while
      # this number only ever reached the cache key, so CI ran whatever Luau
      # had shipped that week under a key claiming 0.700 — and a cache hit
      # then pinned that accident in place. Bump this to move.
      LUAU_VERSION: "0.736"
      LSP_VERSION: "1.49.1"
      ROJO_VERSION: "7.5.1"
      SELENE_VERSION: "0.31.0"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Selene fetches the Roblox standard library into its own cache on
          # first use, so that rides along here rather than being refetched
          # from the network on every run.
          path: |
            .bin
            ~/.cache/selene
          key: toolchain-${{ env.LUAU_VERSION }}-${{ env.LSP_VERSION }}-${{ env.ROJO_VERSION }}-${{ env.SELENE_VERSION }}

      - name: Install toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .bin && cd .bin

          curl -sSfL -o luau.zip \
            "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          unzip -o luau.zip luau

          curl -sSfL -o lsp.zip \
            "https://github.com/JohnnyMorganz/luau-lsp/releases/download/${LSP_VERSION}/luau-lsp-linux.zip"
          unzip -o lsp.zip luau-lsp

          curl -sSfL -o rojo.zip \
            "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          unzip -o rojo.zip rojo

          curl -sSfL -o selene.zip \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip"
          unzip -o selene.zip selene

          chmod +x luau luau-lsp rojo selene
          rm -f ./*.zip

      - name: Run checks
        run: |
          echo "${GITHUB_WORKSPACE}/.bin" >> "$GITHUB_PATH"
          export PATH="${GITHUB_WORKSPACE}/.bin:$PATH"
          ./scripts/check.sh

      - name: Simulate the economy
        run: |
          export PATH="${GITHUB_WORKSPACE}/.bin:$PATH"
          luau scripts/simulate.luau

      - name: Upload place file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: place
          path: |
            build/MowAllTheLawns.rbxl
            build/MowAllTheLawns.rbxlx
          if-no-files-found: error

      # Every merge lands the place on the rolling "latest" release, so there
      # is one permanent link that always holds the newest build rather than
      # an artifact buried in a run page:
      #   https://github.com/mrnickrushing/mow/releases/tag/latest
      #
      # It fires for the default working branch as well as main, because that
      # is where nearly every merge actually lands — gating on main alone
      # meant most merges built the place and then hid it. The release's own
      # headline date is the day the rolling release was first created and
      # never moves, which made a fresh build look stale, so the name carries
      # the build's date instead.
      - name: Name the build
        if: github.ref == 'refs/heads/main' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: echo "BUILD_STAMP=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: Publish place to the latest release
        if: github.ref == 'refs/heads/main' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: "Latest place build — ${{ env.BUILD_STAMP }}"
          body: |
            Built from `${{ github.sha }}` at ${{ env.BUILD_STAMP }}.

            Download `MowAllTheLawns.rbxlx` (XML) or `MowAllTheLawns.rbxl`
            (binary) and open it in Roblox Studio. Updated automatically on
            every merge.
          files: |
            build/MowAllTheLawns.rbxlx
            build/MowAllTheLawns.rbxl

      # Pushes the same build straight to the live Roblox experience — "Mow
      # Money, Mow Problems!" — so the game on a phone or iPad is always the
      # newest merge. The universe and place ids are public identifiers and
      # default to that experience (scripts/publish.sh carries the same pair);
      # only the API key is a secret. Until ROBLOX_API_KEY exists the step
      # prints a note and skips. docs/PUBLISHING.md covers minting the key.
      - name: Publish to Roblox
        if: github.ref == 'refs/heads/main' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID || '10764684362' }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID || '71269136447904' }}
        run: |
          set -euo pipefail
          if [ -z "${ROBLOX_API_KEY:-}" ]; then
            echo "ROBLOX_API_KEY secret not set - skipping publish. See docs/PUBLISHING.md."
            exit 0
          fi
          curl -sSf -X POST \
            "https://apis.roblox.com/universes/v1/${ROBLOX_UNIVERSE_ID}/places/${ROBLOX_PLACE_ID}/versions?versionType=Published" \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @build/MowAllTheLawns.rbxl
          echo ""
          echo "Published to Roblox - the live experience now runs this build."
